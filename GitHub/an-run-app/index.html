<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUN+자취 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js'></script>
    <style>
        :root {
            --bg:#FBF7F2; --bg-alt:#F2EBE2; --surface:#FFFFFF; --ink:#1B1710; --ink-soft:#6B6255;
            --line:#EAE1D3; --accent:#FF5A2E; --accent-ink:#FFFFFF;
            --flame-1:#FF7A2E; --flame-2:#FF3D5A;
            --mood-calm:#1FAE6E; --mood-calm-soft:#E1F5EA;
            --mood-hard:#FF3D5A; --mood-hard-soft:#FFE3E8;
            --shadow: 0 12px 28px -14px rgba(27,23,16,0.28);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg:#15130F; --bg-alt:#1D1B15; --surface:#211F19; --ink:#F5EFE4; --ink-soft:#A69C8B;
                --line:#332F26; --accent:#FF6A3D; --accent-ink:#191309;
                --mood-calm:#35C98A; --mood-calm-soft:#163024;
                --mood-hard:#FF5470; --mood-hard-soft:#331420;
                --shadow: 0 14px 32px -14px rgba(0,0,0,0.6);
            }
        }
        html, body { margin: 0; padding: 0; background: var(--bg-alt); color: var(--ink); }
        body { font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif; min-height: 100vh; }

        .app-shell { background: var(--bg); }
        .brand-mark { font-weight: 900; letter-spacing: -0.01em; }
        .brand-mark .dot { color: var(--accent); }

        .fc .fc-toolbar-title { font-size: 1.1rem !important; font-weight: 800; color: var(--ink); }
        .fc .fc-daygrid-day-number { font-size: 0.95rem !important; padding: 6px !important; color: var(--ink) !important; font-weight: 700 !important; text-decoration: none !important; }
        .fc .fc-day-other .fc-daygrid-day-number { color: var(--line) !important; font-weight: 500 !important; }
        .fc-day-sun .fc-daygrid-day-number, .fc-day-sun .fc-col-header-cell-cushion { color: var(--mood-hard) !important; }
        .fc-day-sat .fc-daygrid-day-number, .fc-day-sat .fc-col-header-cell-cushion { color: #3E6BFF !important; }
        .fc .fc-col-header-cell-cushion { color: var(--ink-soft); font-weight: 800 !important; text-decoration: none !important; }
        .fc .fc-daygrid-day { cursor: pointer; }
        .fc .fc-daygrid-day:hover { background-color: var(--bg-alt); }
        .fc-event-dot-wrap { display: flex; justify-content: center; padding-top: 2px; }
        .fc-event-dot { width: 6px; height: 6px; border-radius: 999px; }
        .fc-event-dot.calm { background: var(--mood-calm); }
        .fc-event-dot.hard { background: var(--mood-hard); }
        .fc-daygrid-event-harness { margin-top: 0 !important; }
        .fc-event { background: transparent !important; border: none !important; box-shadow: none !important; }
        .fc .fc-daygrid-day-frame { min-height: 44px !important; }
        .fc .fc-button-primary { background: var(--surface) !important; border-color: var(--line) !important; color: var(--ink-soft) !important; font-weight: 600; }
        .fc .fc-button-primary:hover { background: var(--bg-alt) !important; }
        .fc .fc-button-primary:disabled { background: var(--surface) !important; color: var(--line) !important; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 15px; }
        .stat-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
        .stat-value { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
        .stat-value small { font-size: 12px; font-weight: 700; margin-left: 2px; }
        .stat-foot { margin-top: 6px; font-size: 11px; color: var(--ink-soft); font-weight: 600; }
        .ring-card { display: flex; align-items: center; gap: 10px; }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s, stroke 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="flex justify-center w-full relative" style="background: var(--bg-alt); min-height: 100vh;">

    <div id="toast" class="hidden fixed top-5 z-[100] px-5 py-3 rounded-xl shadow-lg font-bold text-sm text-white transform -translate-y-10 opacity-0 transition-all duration-300 flex items-center gap-2">
        <span id="toastIcon"></span>
        <span id="toastMessage">메시지</span>
    </div>

    <div id="confirmDialog" class="hidden fixed inset-0 z-[99] flex items-center justify-center p-4" style="background: rgba(20,16,10,0.5); backdrop-filter: blur(2px);">
        <div class="rounded-2xl w-full max-w-xs p-6 shadow-2xl text-center" style="background: var(--surface); border: 1px solid var(--line);">
            <div class="mx-auto w-12 h-12 rounded-full flex items-center justify-center mb-3 text-2xl" style="background: var(--mood-hard-soft); color: var(--mood-hard);">⚠️</div>
            <h3 class="text-base font-bold mb-1" style="color: var(--ink);">기록 삭제</h3>
            <p id="confirmMessage" class="text-xs leading-relaxed mb-6" style="color: var(--ink-soft);"></p>
            <div class="flex gap-2">
                <button id="confirmCancelBtn" class="flex-1 py-2.5 rounded-xl text-xs font-semibold" style="background: var(--bg-alt); color: var(--ink-soft);">취소</button>
                <button id="confirmOkBtn" class="flex-1 py-2.5 text-white rounded-xl text-xs font-bold" style="background: var(--mood-hard);">삭제하기</button>
            </div>
        </div>
    </div>

    <div class="app-shell w-full max-w-md p-4 shadow-xl flex flex-col">
        <h1 class="text-xl text-center mb-4 flex-shrink-0 brand-mark" style="color: var(--ink);">An<span class="dot">·</span>Run <span style="font-weight:400;">🏃</span></h1>

        <div class="stat-grid mb-4 flex-shrink-0">
            <div class="stat-card">
                <div class="stat-label">이달 총거리</div>
                <div class="stat-value" id="totalDistance">0.00<small>km</small></div>
                <div class="stat-foot" id="distanceFoot">목표까지 0.00km</div>
            </div>
            <div class="stat-card ring-card">
                <div class="relative flex items-center justify-center w-14 h-14 flex-shrink-0">
                    <svg width="54" height="54" viewBox="0 0 96 96">
                        <circle style="color:var(--line);" stroke-width="8" stroke="currentColor" fill="transparent" r="38" cx="48" cy="48"/>
                        <circle id="progressCircle" class="progress-ring__circle" stroke-width="8" stroke-linecap="round" stroke="currentColor" fill="transparent" r="38" cx="48" cy="48" stroke-dasharray="238.76" stroke-dashoffset="238.76"/>
                    </svg>
                    <div class="absolute text-center">
                        <span id="chartPercent" class="text-xs font-black" style="color:var(--ink);">0%</span>
                    </div>
                </div>
                <div>
                    <div class="stat-label" style="margin-bottom:2px;">목표 달성률</div>
                    <div class="text-sm font-bold" id="achievementRate" style="color:var(--ink);">0%</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">이달 횟수</div>
                <div class="stat-value" id="totalCount">0<small>회</small></div>
                <div class="stat-foot" id="countFoot">주 평균 0회</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">평균 페이스</div>
                <div class="stat-value" id="avgPace">-:--<small>/km</small></div>
                <div class="stat-foot" id="paceFoot">기록을 추가해보세요</div>
            </div>
        </div>

        <div class="w-full pt-2 pb-4" style="border-top: 1px solid var(--line);">
            <div id="calendar"></div>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-50 flex items-end justify-center" style="background: rgba(20,16,10,0.45); backdrop-filter: blur(2px);">
        <div class="w-full shadow-2xl overflow-hidden" style="background: var(--surface); border-radius: 24px 24px 0 0; max-width: 480px;" id="modalPanel">
            <div class="flex justify-center pt-2.5 pb-1">
                <div style="width:36px; height:4px; border-radius:999px; background: var(--line);"></div>
            </div>
            <div class="px-5 pt-2 pb-4 flex justify-between items-start" style="border-bottom: 1px solid var(--line);">
                <div>
                    <h2 id="modalTitle" class="text-base font-black flex items-center gap-1.5" style="color: var(--ink);">🏃 러닝 자취 등록</h2>
                    <p id="modalDate" class="text-xs font-semibold mt-0.5" style="color: var(--ink-soft);"></p>
                </div>
                <button onclick="closeModal()" class="text-lg p-1" style="color: var(--ink-soft);">&times;</button>
            </div>

            <div class="p-5 space-y-5">
                <div class="relative">
                    <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
                    
                    <div id="photoDropZone" 
                         onclick="document.getElementById('photoInput').click()"
                         ondragover="handleDragOver(event)"
                         ondragleave="handleDragLeave(event)"
                         ondrop="handleDrop(event)"
                         class="w-full py-4 px-4 rounded-xl text-center cursor-pointer transition-all flex flex-col items-center justify-center gap-1 text-sm font-semibold"
                         style="background: var(--bg-alt); border: 2px dashed var(--line); color: var(--ink-soft);">
                        <div class="text-2xl mb-0.5">🖼️</div>
                        <div class="text-xs font-bold" style="color: var(--ink);">러닝 스크린샷 사진 업로드</div>
                        <div class="text-[11px]" style="color: var(--ink-soft);">클릭하여 갤러리/파일 선택 또는 사진을 여기에 드래그앤드롭</div>
                    </div>

                    <div id="photoPreviewContainer" class="hidden relative rounded-xl overflow-hidden p-2.5 flex items-center justify-between gap-3" style="background: var(--bg-alt); border: 1.5px solid var(--line);">
                        <div class="flex items-center gap-3 min-w-0 flex-1">
                            <img id="photoPreviewImg" src="" alt="러닝 사진 미리보기" class="w-12 h-12 object-cover rounded-lg flex-shrink-0 border" style="border-color: var(--line);" />
                            <div class="min-w-0 flex-1">
                                <div class="text-xs font-bold truncate" id="photoFileName" style="color: var(--ink);">uploaded_image.jpg</div>
                                <div class="text-[11px] mt-0.5 flex items-center gap-1 font-medium" id="photoStatusText" style="color: var(--accent);">
                                    <span id="photoStatusSpinner" class="inline-block animate-spin">⏳</span>
                                    <span id="photoStatusMsg">자동 인식 분석 중...</span>
                                </div>
                            </div>
                        </div>
                        <button type="button" onclick="clearPhotoSelection()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold flex-shrink-0 transition-colors" style="background: var(--surface); color: var(--mood-hard); border: 1px solid var(--line);">
                            변경
                        </button>
                    </div>
                </div>

                <div class="relative">
                    <label class="text-xs font-bold tracking-wide block mb-1.5" style="color: var(--ink-soft);">러닝 거리</label>
                    <div class="relative flex items-center">
                        <input type="number" id="distance" placeholder="0.00" step="0.01"
                               class="w-full px-4 py-3.5 rounded-xl text-base font-semibold focus:outline-none transition-all pr-12"
                               style="background: var(--bg-alt); border: 1.5px solid transparent; color: var(--ink);">
                        <span class="absolute right-4 text-sm font-bold" style="color: var(--ink-soft);">km</span>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold tracking-wide block mb-1.5" style="color: var(--ink-soft);">러닝 시간</label>
                    <input type="text" id="duration" placeholder="00:30:00"
                           class="w-full px-4 py-3.5 rounded-xl text-base font-semibold focus:outline-none transition-all"
                           style="background: var(--bg-alt); border: 1.5px solid transparent; color: var(--ink);">
                    <span class="block mt-1.5 pl-0.5 leading-relaxed" style="font-size: 11px; color: var(--ink-soft);">
                        💡 <b>시:분:초</b> 형식으로 입력해주세요. (예: 00:30:00)
                    </span>
                </div>

                <div>
                    <label class="text-xs font-bold tracking-wide block mb-1.5" style="color: var(--ink-soft);">기분 상태</label>
                    <div class="relative">
                        <select id="mood" class="w-full px-4 py-3.5 rounded-xl text-base font-semibold focus:outline-none transition-all appearance-none"
                                style="background: var(--bg-alt); border: 1.5px solid transparent; color: var(--ink);">
                            <option value="편안함">😊 편안함</option>
                            <option value="숨참">🥵 숨참</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="px-5 pb-6 pt-1 flex gap-2" id="modalActions"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbz7ezbOyt7erzMXuHNhDEz7_IxIOhh047-9-5HLpRPiERAq5Nd1AoQoyWzz8qeeUs8uIQ/exec';

        function apiCall(action, params) {
            params = params || {};
            const query = new URLSearchParams(Object.assign({ action: action }, params)).toString();
            return fetch(API_URL + '?' + query).then(function(res) {
                if (!res.ok) throw new Error('네트워크 오류 (' + res.status + ')');
                return res.json();
            });
        }

        let selectedDate = "";
        let calendar = null;
        let cachedRecords = [];

        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                initialDate: new Date().toISOString().split('T')[0],
                locale: 'ko',
                height: 'auto',
                fixedWeekCount: false,
                datesSet: function() {
                    updateMonthlyStats();
                },
                dateClick: function(info) {
                    openModal(info.dateStr);
                },
                eventClick: function(info) {
                    const props = info.event.extendedProps;
                    const eventDate = info.event.startStr.split('T')[0];
                    openModal(eventDate, props.distance, props.duration, props.mood);
                },
                eventContent: function(arg) {
                    const mood = arg.event.extendedProps.mood;
                    const cls = mood === '숨참' ? 'hard' : 'calm';
                    const wrap = document.createElement('div');
                    wrap.className = 'fc-event-dot-wrap';
                    wrap.title = arg.event.title;
                    const dot = document.createElement('span');
                    dot.className = 'fc-event-dot ' + cls;
                    wrap.appendChild(dot);
                    return { domNodes: [wrap] };
                }
            });
            calendar.render();
            loadData();
        });

        function sanitizeDuration(durationStr) {
            if (!durationStr) return "";
            const str = String(durationStr).trim();
            if (str.includes("GMT") || str.includes("1899") || str.includes("1900") || str.includes("T")) {
                const timeMatch = str.match(/(\d{2}):(\d{2}):(\d{2})/);
                if (timeMatch) return timeMatch[0];
            }
            return str;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');

            msg.innerText = message;
            toast.className = "fixed top-5 z-[100] px-5 py-3 rounded-xl shadow-lg font-bold text-sm text-white transform transition-all duration-300 flex items-center gap-2";
            toast.style.background = (type === 'success') ? 'var(--accent)' : 'var(--mood-hard)';

            if (type === 'success') {
                icon.innerHTML = '✅';
            } else {
                icon.innerHTML = '❌';
            }

            toast.classList.remove('hidden', '-translate-y-10', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-10', 'opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        }

        function showConfirm(message, onConfirm) {
            const dialog = document.getElementById('confirmDialog');
            const msg = document.getElementById('confirmMessage');
            const okBtn = document.getElementById('confirmOkBtn');
            const cancelBtn = document.getElementById('confirmCancelBtn');

            msg.innerText = message;
            dialog.classList.remove('hidden');

            const handleOk = () => {
                dialog.classList.add('hidden');
                cancelBtn.removeEventListener('click', handleCancel);
                onConfirm();
            };

            const handleCancel = () => {
                dialog.classList.add('hidden');
                okBtn.removeEventListener('click', handleOk);
            };

            okBtn.addEventListener('click', handleOk, { once: true });
            cancelBtn.addEventListener('click', handleCancel, { once: true });
        }

        function openModal(dateStr, distance = '', duration = '', mood = '편안함') {
            selectedDate = dateStr.split('T')[0];
            document.getElementById('modalDate').innerText = selectedDate;

            const distanceInput = document.getElementById('distance');
            const durationInput = document.getElementById('duration');
            const moodInput = document.getElementById('mood');
            const modalActions = document.getElementById('modalActions');

            const cleanDuration = sanitizeDuration(duration);

            distanceInput.value = distance;
            durationInput.value = cleanDuration;
            moodInput.value = mood;

            clearPhotoSelection();

            if (distance !== '' && distance !== undefined && distance !== null) {
                document.getElementById('modalTitle').innerHTML = '🏃 러닝 자취 수정 및 삭제';
                modalActions.innerHTML = `
                    <button type="button" onclick="deleteData()" class="flex-1 py-3 rounded-xl text-sm font-bold transition-colors" style="background: var(--mood-hard-soft); color: var(--mood-hard);">삭제</button>
                    <button type="button" onclick="saveData()" class="flex-1 py-3 text-white rounded-xl text-sm font-bold transition-all" style="background: var(--accent); box-shadow: 0 10px 20px -10px rgba(255,90,46,0.7);">수정 완료</button>
                `;
            } else {
                document.getElementById('modalTitle').innerHTML = '🏃 러닝 자취 등록';
                modalActions.innerHTML = `
                    <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl text-sm font-medium transition-colors" style="background: var(--bg-alt); color: var(--ink-soft);">취소</button>
                    <button type="button" onclick="saveData()" class="flex-1 py-3 text-white rounded-xl text-sm font-bold transition-all" style="background: var(--accent); box-shadow: 0 10px 20px -10px rgba(255,90,46,0.7);">저장하기</button>
                `;
            }

            document.getElementById('modal').classList.remove('hidden');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            const dropZone = document.getElementById('photoDropZone');
            if (dropZone) {
                dropZone.style.borderColor = 'var(--accent)';
                dropZone.style.background = 'var(--surface)';
            }
        }

        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            const dropZone = document.getElementById('photoDropZone');
            if (dropZone) {
                dropZone.style.borderColor = 'var(--line)';
                dropZone.style.background = 'var(--bg-alt)';
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            handleDragLeave(e);
            const dt = e.dataTransfer;
            const files = dt && dt.files;
            if (files && files.length > 0) {
                processPhotoFile(files[0]);
            }
        }

        function handlePhotoUpload(event) {
            const file = event.target.files && event.target.files[0];
            event.target.value = '';
            if (file) {
                processPhotoFile(file);
            }
        }

        function clearPhotoSelection() {
            const photoInput = document.getElementById('photoInput');
            const dropZone = document.getElementById('photoDropZone');
            const previewContainer = document.getElementById('photoPreviewContainer');
            const previewImg = document.getElementById('photoPreviewImg');

            if (photoInput) photoInput.value = '';
            if (dropZone) dropZone.classList.remove('hidden');
            if (previewContainer) previewContainer.classList.add('hidden');
            if (previewImg) previewImg.src = '';
        }

        function highlightInput(inputEl) {
            if (!inputEl) return;
            inputEl.style.border = '1.5px solid var(--accent)';
            inputEl.style.boxShadow = '0 0 0 3px rgba(255, 90, 46, 0.25)';
            setTimeout(() => {
                inputEl.style.border = '1.5px solid transparent';
                inputEl.style.boxShadow = 'none';
            }, 1800);
        }

        function parseRunningDataFromText(text) {
            if (!text) return { distance: null, duration: null };

            const fullText = text.replace(/\r/g, '');

            let foundDistance = null;
            let foundDuration = null;

            // --- 1. Distance extraction ---
            const kmMatch = fullText.match(/(\d+(?:[\.,]\d+)?)\s*(?:km|KM|Km|키로|킬로미터)/i);
            if (kmMatch) {
                foundDistance = kmMatch[1].replace(',', '.');
            }

            if (!foundDistance) {
                const labelMatch = fullText.match(/(?:거리|distance|dist)\s*[:\s]*(\d+(?:[\.,]\d+)?)/i);
                if (labelMatch) {
                    foundDistance = labelMatch[1].replace(',', '.');
                }
            }

            if (!foundDistance) {
                const decimalMatches = fullText.match(/\b(\d{1,2}[\.,]\d{1,2})\b/g);
                if (decimalMatches) {
                    for (let m of decimalMatches) {
                        const val = parseFloat(m.replace(',', '.'));
                        if (val >= 0.5 && val <= 100) {
                            foundDistance = val.toFixed(2);
                            break;
                        }
                    }
                }
            }

            // --- 2. Duration extraction ---
            const hmsMatch = fullText.match(/\b([0-2]?\d):([0-5]\d):([0-5]\d)\b/);
            if (hmsMatch) {
                const h = hmsMatch[1].padStart(2, '0');
                const m = hmsMatch[2];
                const s = hmsMatch[3];
                foundDuration = `${h}:${m}:${s}`;
            }

            if (!foundDuration) {
                const msMatch = fullText.match(/\b([0-5]?\d):([0-5]\d)\b/);
                if (msMatch) {
                    const m = msMatch[1].padStart(2, '0');
                    const s = msMatch[2];
                    foundDuration = `00:${m}:${s}`;
                }
            }

            if (!foundDuration) {
                const korH = fullText.match(/(\d+)\s*시간/);
                const korM = fullText.match(/(\d+)\s*분/);
                const korS = fullText.match(/(\d+)\s*초/);
                if (korH || korM || korS) {
                    const h = (korH ? korH[1] : '0').padStart(2, '0');
                    const m = (korM ? korM[1] : '0').padStart(2, '0');
                    const s = (korS ? korS[1] : '0').padStart(2, '0');
                    foundDuration = `${h}:${m}:${s}`;
                }
            }

            if (!foundDuration) {
                const quoteMatch = fullText.match(/(\d+)'(\d+)"/);
                if (quoteMatch) {
                    const m = quoteMatch[1].padStart(2, '0');
                    const s = quoteMatch[2].padStart(2, '0');
                    foundDuration = `00:${m}:${s}`;
                }
            }

            return { distance: foundDistance, duration: foundDuration };
        }

        function processPhotoFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                showToast('이미지 파일만 업로드할 수 있습니다.', 'error');
                return;
            }

            const dropZone = document.getElementById('photoDropZone');
            const previewContainer = document.getElementById('photoPreviewContainer');
            const previewImg = document.getElementById('photoPreviewImg');
            const fileName = document.getElementById('photoFileName');
            const statusMsg = document.getElementById('photoStatusMsg');
            const statusSpinner = document.getElementById('photoStatusSpinner');

            dropZone.classList.add('hidden');
            previewContainer.classList.remove('hidden');
            fileName.innerText = file.name || '러닝_사진.jpg';
            statusSpinner.classList.remove('hidden');
            statusMsg.innerText = '사진 자동 인식 중...';
            statusMsg.style.color = 'var(--accent)';

            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
            };
            reader.readAsDataURL(file);

            Tesseract.recognize(file, 'kor+eng')
                .then(function(result) {
                    const text = result.data.text || '';
                    const parsed = parseRunningDataFromText(text);

                    let foundAny = false;

                    if (parsed.distance) {
                        const distInput = document.getElementById('distance');
                        distInput.value = parsed.distance;
                        highlightInput(distInput);
                        foundAny = true;
                    }

                    if (parsed.duration) {
                        const durInput = document.getElementById('duration');
                        durInput.value = parsed.duration;
                        highlightInput(durInput);
                        foundAny = true;
                    }

                    if (parsed.distance && parsed.duration) {
                        statusSpinner.classList.add('hidden');
                        statusMsg.innerText = `✅ 거리(${parsed.distance}km) / 시간(${parsed.duration}) 인식 완료!`;
                        statusMsg.style.color = 'var(--mood-calm)';
                        showToast('사진에서 거리/시간을 가져왔어요. 확인 후 저장해주세요.');
                    } else if (foundAny) {
                        statusSpinner.classList.add('hidden');
                        statusMsg.innerText = `⚠️ 일부 항목만 인식되었습니다.`;
                        statusMsg.style.color = 'var(--accent)';
                        showToast('일부 값만 인식됐어요, 나머지는 확인해서 입력해주세요.', 'error');
                    } else {
                        statusSpinner.classList.add('hidden');
                        statusMsg.innerText = `❌ 값을 찾지 못했습니다. 직접 입력해주세요.`;
                        statusMsg.style.color = 'var(--mood-hard)';
                        showToast('사진에서 값을 찾지 못했어요, 직접 입력해주세요.', 'error');
                    }
                })
                .catch(function(err) {
                    statusSpinner.classList.add('hidden');
                    statusMsg.innerText = `❌ 인식 실패`;
                    statusMsg.style.color = 'var(--mood-hard)';
                    showToast('사진 인식에 실패했어요: ' + err.message, 'error');
                });
        }

        function loadData() {
            apiCall('getRunRecords')
                .then(function(data) {
                    if (!Array.isArray(data)) {
                        throw new Error((data && data.message) || '기록을 불러오지 못했습니다.');
                    }

                    calendar.removeAllEvents();
                    cachedRecords = data;

                    data.forEach(r => {
                        const eventDate = String(r.date).split('T')[0];
                        const moodEmoji = r.mood === "숨참" ? "🥵" : "😊";

                        calendar.addEvent({
                            title: `${moodEmoji} ${r.distance}km`,
                            start: eventDate,
                            extendedProps: { distance: r.distance, duration: r.duration, mood: r.mood }
                        });
                    });

                    updateMonthlyStats();
                })
                .catch(function(err) {
                    showToast("기록을 불러오는 데 실패했습니다: " + err.message, "error");
                });
        }

        function parseDurationToMinutes(duration) {
            const parts = String(duration || '0:0:0').split(':').map(Number);
            const h = parts[0] || 0, m = parts[1] || 0, s = parts[2] || 0;
            return h * 60 + m + s / 60;
        }

        function updateMonthlyStats() {
            if (!calendar) return;
            const currentViewDate = calendar.getDate();
            const targetYear = currentViewDate.getFullYear();
            const targetMonth = currentViewDate.getMonth();

            const monthlyFiltered = cachedRecords.filter(r => {
                const dateStr = String(r.date).split('T')[0];
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                    const year = parseInt(parts[0], 10);
                    const month = parseInt(parts[1], 10) - 1;
                    return year === targetYear && month === targetMonth;
                }
                return false;
            });

            const currentMonthTotalDistance = monthlyFiltered.reduce((sum, r) => sum + parseFloat(r.distance || 0), 0);
            document.getElementById('totalDistance').innerHTML = currentMonthTotalDistance.toFixed(2) + "<small>km</small>";
            document.getElementById('totalCount').innerHTML = monthlyFiltered.length + "<small>회</small>";

            const avgPerWeek = (monthlyFiltered.length / 4.345).toFixed(1);
            document.getElementById('countFoot').innerText = `주 평균 ${avgPerWeek}회`;

            const goalRemain = Math.max(0, 100 - currentMonthTotalDistance);
            document.getElementById('distanceFoot').innerText = `목표까지 ${goalRemain.toFixed(2)}km`;

            const totalMinutes = monthlyFiltered.reduce((sum, r) => sum + parseDurationToMinutes(r.duration), 0);
            if (currentMonthTotalDistance > 0) {
                const paceMinPerKm = totalMinutes / currentMonthTotalDistance;
                let paceMin = Math.floor(paceMinPerKm);
                let paceSec = Math.round((paceMinPerKm - paceMin) * 60);
                if (paceSec === 60) { paceMin += 1; paceSec = 0; }
                document.getElementById('avgPace').innerHTML = `${paceMin}:${String(paceSec).padStart(2, '0')}<small>/km</small>`;
                document.getElementById('paceFoot').innerText = '이번 달 평균 페이스';
            } else {
                document.getElementById('avgPace').innerHTML = `-:--<small>/km</small>`;
                document.getElementById('paceFoot').innerText = '기록을 추가해보세요';
            }

            updateAchievementRate(currentMonthTotalDistance);
        }

        function setProgress(percent) {
            const circle = document.getElementById('progressCircle');
            const rateText = document.getElementById('achievementRate');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;

            const safePercent = Math.min(Math.max(percent, 0), 100);
            const offset = circumference - (safePercent / 100) * circumference;
            circle.style.strokeDashoffset = offset;

            circle.removeAttribute('stroke');
            rateText.className = "text-sm font-bold transition-colors duration-300";

            if (percent < 50) {
                circle.setAttribute('stroke', '#FFA800');
                rateText.classList.add('text-[#FFA800]');
            } else if (percent < 100) {
                circle.setAttribute('stroke', '#03C75A');
                rateText.classList.add('text-[#03C75A]');
            } else {
                circle.setAttribute('stroke', '#0064FF');
                rateText.classList.add('text-[#0064FF]');
            }
        }

        function updateAchievementRate(monthlyDistance) {
            apiCall('getMonthlyGoalDistance')
                .then(function(goalDistance) {
                    const goal = parseFloat(goalDistance) || 100;
                    const rate = goal > 0 ? ((monthlyDistance / goal) * 100).toFixed(1) : 0;

                    document.getElementById('achievementRate').innerText = rate + "%";
                    document.getElementById('chartPercent').innerText = Math.round(rate) + "%";
                    setProgress(parseFloat(rate));
                })
                .catch(function(err) {
                    console.error("목표 거리를 조회하지 못했습니다.", err);
                });
        }

        function saveData() {
            const distanceVal = document.getElementById('distance').value;
            const durationVal = document.getElementById('duration').value;

            if(!distanceVal || !durationVal) {
                showToast("거리와 시간을 모두 입력해주세요!", "error");
                return;
            }

            const timeRegex = /^(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d$/;
            if (!timeRegex.test(durationVal)) {
                showToast("러닝 시간 형식을 맞춰주세요! (00:30:00)", "error");
                return;
            }

            apiCall('saveRunRecord', {
                date: selectedDate,
                distance: parseFloat(distanceVal),
                duration: durationVal,
                mood: document.getElementById('mood').value
            })
                .then(function(res) {
                    if (!res.success) throw new Error(res.message || '저장에 실패했습니다.');
                    showToast(res.message || "기록이 저장되었습니다.");
                    closeModal();
                    loadData();
                })
                .catch(function(err) {
                    showToast("저장에 실패했습니다: " + err.message, "error");
                });
        }

        function deleteData() {
            showConfirm(`${selectedDate} 날짜의 러닝 기록을 정말 삭제하시겠습니까?`, function() {
                apiCall('deleteRunRecord', { date: selectedDate })
                    .then(function(res) {
                        showToast(res.message || "성공적으로 삭제되었습니다.");
                        closeModal();
                        loadData();
                    })
                    .catch(function(err) {
                        showToast("삭제 실패: " + err.message, "error");
                    });
            });
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
    </script>
</body>
</html>
